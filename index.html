<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para Fer 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05020a;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #ffffff;
    }

    /* Fondo Galaxia Dorada */
    .galaxy-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #3d2a00 0%, #1a0c2e 50%, #030108 100%);
      z-index: 1;
    }

    .glow-core {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(255,215,0,0.35) 0%, rgba(255,140,0,0.15) 50%, rgba(0,0,0,0) 70%);
      border-radius: 50%;
      filter: blur(20px);
      animation: pulseGlow 4s ease-in-out infinite alternate;
      z-index: 2;
    }

    @keyframes pulseGlow {
      0% { transform: translate(-50%, -50%) scale(0.85); opacity: 0.6; }
      100% { transform: translate(-50%, -50%) scale(1.25); opacity: 1; }
    }

    /* Contenedor Principal */
    .container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 50px 20px 30px 20px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.8rem, 6vw, 2.8rem);
      color: #ffea00;
      text-shadow: 0 0 12px rgba(255, 234, 0, 0.9), 0 0 25px rgba(255, 170, 0, 0.7);
      font-weight: 800;
      line-height: 1.25;
    }

    /* Ramo de Flores Central Giratorio */
    .bouquet-wrapper {
      position: absolute;
      top: 48%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .bouquet {
      font-size: clamp(90px, 25vw, 140px);
      filter: drop-shadow(0 0 20px rgba(255, 234, 0, 0.8)) drop-shadow(0 0 40px rgba(255, 140, 0, 0.5));
      animation: rotateBouquet 12s linear infinite;
      transform-origin: center center;
    }

    @keyframes rotateBouquet {
      0% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(180deg) scale(1.08); }
      100% { transform: rotate(360deg) scale(1); }
    }

    .messages {
      margin-bottom: 20px;
    }

    .distance-msg {
      font-size: clamp(1.1rem, 3.8vw, 1.4rem);
      color: #ffffff;
      max-width: 500px;
      margin-bottom: 8px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      font-weight: 600;
    }

    .sub-msg {
      font-size: clamp(0.95rem, 3.2vw, 1.15rem);
      color: #ffd700;
      max-width: 450px;
      line-height: 1.4;
      text-shadow: 0 2px 8px rgba(0,0,0,0.9);
      font-style: italic;
    }

    /* Partículas y flores flotantes */
    .particle {
      position: absolute;
      pointer-events: none;
      z-index: 3;
      animation: floatUp linear infinite;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(105vh) rotate(0deg) scale(0.6);
        opacity: 0;
      }
      20% {
        opacity: 0.9;
      }
      80% {
        opacity: 0.9;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    /* Botón de Audio */
    .audio-btn {
      position: fixed;
      bottom: 25px;
      right: 20px;
      z-index: 50;
      background: rgba(255, 215, 0, 0.25);
      border: 1.5px solid #ffd700;
      color: #ffd700;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.3rem;
      cursor: pointer;
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      pointer-events: auto;
      box-shadow: 0 0 15px rgba(255, 215, 0, 0.4);
    }
  </style>
</head>
<body>

  <div class="galaxy-bg"></div>
  <div class="glow-core"></div>

  <!-- Ramo Central -->
  <div class="bouquet-wrapper">
    <div class="bouquet">💐</div>
  </div>

  <div class="container">
    <h1>Feliz día de las flores amarillas mi Fer 🌻</h1>

    <div class="messages">
      <p class="distance-msg">
        Sé que estoy lejos pero no olvides que te amo y te extraño.
      </p>
      <p class="sub-msg">
        Aún no olvido tu mirada y tu cariño.
      </p>
    </div>
  </div>

  <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🎵</button>

  <script>
    // Generador de flores y destellos flotantes
    const items = ['🌻', '🌼', '✨', '💛', '🌸', '⭐'];
    
    function createParticle() {
      const p = document.createElement('div');
      p.classList.add('particle');
      p.innerText = items[Math.floor(Math.random() * items.length)];
      
      p.style.left = Math.random() * 100 + 'vw';
      p.style.fontSize = (Math.random() * 20 + 16) + 'px';
      
      const duration = Math.random() * 4 + 5; // Duración entre 5s y 9s
      p.style.animationDuration = duration + 's';
      p.style.filter = `drop-shadow(0 0 8px rgba(255, 234, 0, 0.8))`;

      document.body.appendChild(p);

      setTimeout(() => {
        p.remove();
      }, duration * 1000);
    }

    // Crear partículas continuamente
    setInterval(createParticle, 300);

    // Reproductor de sonido interactivo
    let audioCtx = null;
    let isPlaying = false;
    let osc = null;

    function toggleAudio() {
      const btn = document.getElementById('audioBtn');
      if (!isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(329.63, audioCtx.currentTime); // Nota E4
        gain.gain.setValueAtTime(0.05, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();

        isPlaying = true;
        btn.innerText = '🔊';
      } else {
        if (osc) osc.stop();
        isPlaying = false;
        btn.innerText = '🎵';
      }
    }
  </script>
</body>
</html>
