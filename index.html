<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Fer 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020005;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      color: #ffffff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .interface {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      padding: 40px 20px;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(1.8rem, 5vw, 3.2rem);
      color: #ffea00;
      text-shadow: 0 0 15px rgba(255, 234, 0, 0.8), 0 0 30px rgba(255, 170, 0, 0.6);
      font-weight: 800;
      line-height: 1.2;
    }

    .messages-container {
      margin-bottom: 20px;
    }

    .distance-msg {
      font-size: clamp(1.1rem, 2.8vw, 1.5rem);
      color: #fff8e1;
      max-width: 600px;
      margin-bottom: 10px;
      line-height: 1.4;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      font-weight: 600;
    }

    .sub-msg {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: #ffd700;
      max-width: 500px;
      line-height: 1.5;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      font-style: italic;
    }

    .audio-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      color: #ffd700;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
      pointer-events: auto;
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🎵</button>

  <div class="interface">
    <h1>Feliz día de las flores amarillas mi Fer 🌻</h1>
    
    <div class="messages-container">
      <p class="distance-msg">
        Sé que estoy lejos pero no olvides que te amo y te extraño.
      </p>
      <p class="sub-msg">
        Aún no olvido tu mirada y tu cariño.
      </p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.min.js"></script>
  
  <script>
    // --- ESCENA THREE.JS ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 7;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // --- PLANETA VENUS (CENTRAL) ---
    const planetGeometry = new THREE.SphereGeometry(1.6, 64, 64);
    
    // Textura/Material del Planeta brillante tipo Venus
    const planetMaterial = new THREE.MeshPhongMaterial({
      color: 0xffaa00,
      emissive: 0x552200,
      specular: 0xffea00,
      shininess: 25,
      wireframe: false
    });

    const planet = new THREE.Mesh(planetGeometry, planetMaterial);
    scene.add(planet);

    // Luz ambiental y puntual para dar volumen al planeta
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
    scene.add(ambientLight);

    const pointLight = new THREE.PointLight(0xffea00, 2, 50);
    pointLight.position.set(5, 5, 5);
    scene.add(pointLight);

    // --- RAMOS DE FLORES GIRANDO ALREDEDOR ---
    function createFlowerTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.font = '90px serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('💐', 64, 64);
      return new THREE.CanvasTexture(canvas);
    }

    const flowerTexture = createFlowerTexture();
    const flowerMaterial = new THREE.SpriteMaterial({ map: flowerTexture, transparent: true });

    const flowerGroup = new THREE.Group();
    const flowerCount = 18;
    const orbitRadius = 3.2;

    for (let i = 0; i < flowerCount; i++) {
      const sprite = new THREE.Sprite(flowerMaterial);
      const angle = (i / flowerCount) * Math.PI * 2;
      
      sprite.position.x = Math.cos(angle) * orbitRadius;
      sprite.position.z = Math.sin(angle) * orbitRadius;
      sprite.position.y = (Math.random() - 0.5) * 0.8;
      sprite.scale.set(0.8, 0.8, 0.8);
      
      flowerGroup.add(sprite);
    }

    // Inclinamos ligeramente la órbita para mejor efecto 3D
    flowerGroup.rotation.x = 0.3;
    flowerGroup.rotation.z = -0.2;
    scene.add(flowerGroup);

    // --- FONDO DE ESTRELLAS/PARTÍCULAS ---
    const starsCount = 600;
    const starGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 20;
      positions[i + 1] = (Math.random() - 0.5) * 20;
      positions[i + 2] = (Math.random() - 0.5) * 20;
    }

    starGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    const starMaterial = new THREE.PointsMaterial({
      size: 0.04,
      color: 0xffea00,
      transparent: true,
      opacity: 0.7
    });

    const starParticles = new THREE.Points(starGeometry, starMaterial);
    scene.add(starParticles);

    // --- ANIMACIÓN ---
    const clock = new THREE.Clock();
    function animate() {
      const elapsedTime = clock.getElapsedTime();

      // Rotación del planeta sobre su eje
      planet.rotation.y = elapsedTime * 0.2;

      // Rotación de los ramos alrededor del planeta
      flowerGroup.rotation.y = elapsedTime * 0.5;

      // Movimiento suave de fondo
      starParticles.rotation.y = elapsedTime * 0.02;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- AUDIO ---
    let audioCtx = null;
    let isPlaying = false;
    let osc = null;

    function toggleAudio() {
      const btn = document.getElementById('audioBtn');
      if (!isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(329.63, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();

        isPlaying = true;
        btn.innerText = '🔊';
      } else {
        if (osc) osc.stop();
        isPlaying = false;
        btn.innerText = '🎵';
      }
    }
  </script>
</body>
</html>
