<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Fer 🌻</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #020005;
      font-family: system-ui, -apple-system, Roboto, sans-serif;
      color: #ffffff;
    }

    #webgl-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .interface {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 25px;
      background: radial-gradient(circle, rgba(0,0,0,0.1) 20%, rgba(2,0,5,0.75) 100%);
    }

    h1 {
      font-size: clamp(2rem, 5.5vw, 3.8rem);
      color: #ffea00;
      text-shadow: 0 0 15px rgba(255, 234, 0, 0.8), 0 0 30px rgba(255, 170, 0, 0.6);
      margin-bottom: 20px;
      font-weight: 800;
      line-height: 1.2;
    }

    .distance-msg {
      font-size: clamp(1.2rem, 3vw, 1.6rem);
      color: #fff8e1;
      max-width: 600px;
      margin-bottom: 25px;
      line-height: 1.5;
      text-shadow: 0 2px 10px rgba(0,0,0,0.9);
      font-weight: 600;
    }

    .sub-msg {
      font-size: clamp(1rem, 2.2vw, 1.25rem);
      color: #ffd700;
      max-width: 500px;
      line-height: 1.6;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
      font-style: italic;
    }

    .audio-btn {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 50;
      background: rgba(255, 215, 0, 0.2);
      border: 1px solid #ffd700;
      color: #ffd700;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.2rem;
      cursor: pointer;
      backdrop-filter: blur(5px);
    }

    .floating-element {
      position: absolute;
      pointer-events: none;
      z-index: 5;
      animation: floatAnimation linear infinite;
    }

    @keyframes floatAnimation {
      0% {
        transform: translateY(105vh) rotate(0deg);
        opacity: 0.95;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg);
        opacity: 0;
      }
    }
  </style>
</head>
<body>

  <canvas id="webgl-canvas"></canvas>

  <button class="audio-btn" id="audioBtn" onclick="toggleAudio()">🎵</button>

  <div class="interface">
    <h1>Feliz día de las flores amarillas mi Fer 🌻</h1>
    <p class="distance-msg">
      Sé que estoy lejos pero no olvides que te amo y te extraño.
    </p>
    <p class="sub-msg">
      Aún no olvido tu mirada y tu cariño.
    </p>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  
  <script>
    // --- ESCENA THREE.JS (EFECTO GALAXIA DEL VIDEO) ---
    const canvas = document.getElementById('webgl-canvas');
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.z = 4;

    const renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

    // Shader Nebulosa
    const nebulaGeometry = new THREE.PlaneGeometry(15, 15);
    const nebulaMaterial = new THREE.ShaderMaterial({
      uniforms: {
        uTime: { value: 0 }
      },
      vertexShader: `
        varying vec2 vUv;
        void main() {
          vUv = uv;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }
      `,
      fragmentShader: `
        uniform float uTime;
        varying vec2 vUv;

        void main() {
          vec2 st = vUv * 2.0 - 1.0;
          float t = uTime * 0.2;
          
          float d = length(st);
          vec3 color1 = vec3(0.02, 0.0, 0.08); 
          vec3 color2 = vec3(0.3, 0.0, 0.4);  
          vec3 color3 = vec3(1.0, 0.8, 0.2);  

          vec3 finalColor = mix(color1, color2, smoothstep(0.0, 1.2, d + sin(t)*0.2));
          finalColor = mix(finalColor, color3, (1.0 - d) * 0.25);

          gl_FragColor = vec4(finalColor, 1.0);
        }
      `
    });

    const nebulaMesh = new THREE.Mesh(nebulaGeometry, nebulaMaterial);
    nebulaMesh.position.z = -2;
    scene.add(nebulaMesh);

    // Partículas brillantes
    const starsCount = 900;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(starsCount * 3);

    for (let i = 0; i < starsCount * 3; i += 3) {
      positions[i] = (Math.random() - 0.5) * 10;
      positions[i + 1] = (Math.random() - 0.5) * 10;
      positions[i + 2] = (Math.random() - 0.5) * 8;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));

    const starsMaterial = new THREE.PointsMaterial({
      size: 0.035,
      color: 0xffea00,
      transparent: true,
      opacity: 0.85
    });

    const starParticles = new THREE.Points(geometry, starsMaterial);
    scene.add(starParticles);

    const clock = new THREE.Clock();
    function animate() {
      const elapsedTime = clock.getElapsedTime();
      nebulaMaterial.uniforms.uTime.value = elapsedTime;

      starParticles.rotation.y = elapsedTime * 0.04;
      starParticles.rotation.x = elapsedTime * 0.02;

      renderer.render(scene, camera);
      requestAnimationFrame(animate);
    }
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // --- FLORES Y EMOTICONES FLOTANTES ---
    function createFloatingFlower() {
      const el = document.createElement('div');
      el.classList.add('floating-element');
      
      const items = ['🌻', '🌼', '✨', '💛'];
      el.innerText = items[Math.floor(Math.random() * items.length)];
      
      el.style.left = Math.random() * 95 + 'vw';
      el.style.fontSize = (Math.random() * 22 + 18) + 'px';
      
      const duration = Math.random() * 5 + 5;
      el.style.animationDuration = duration + 's';

      document.body.appendChild(el);
      setTimeout(() => el.remove(), duration * 1000);
    }
    setInterval(createFloatingFlower, 400);

    // --- AUDIO ---
    let audioCtx = null;
    let isPlaying = false;
    let osc = null;

    function toggleAudio() {
      const btn = document.getElementById('audioBtn');
      if (!isPlaying) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(329.63, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.04, audioCtx.currentTime);

        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();

        isPlaying = true;
        btn.innerText = '🔊';
      } else {
        if (osc) osc.stop();
        isPlaying = false;
        btn.innerText = '🎵';
      }
    }
  </script>
</body>
</html>
